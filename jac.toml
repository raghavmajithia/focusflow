[project]
name = "focusflow"
version = "0.1.0"
description = "A calm, graph-backed personal planner for coursework and life."
default-app = "web"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-error-boundary = "^5.0.0"
react-native-web = "^0.19.13"
react-native-svg = "^15.13.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"
platform = "android"

[apps.web]
kind = "web-app"
entry-point = "main"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[client.react_native]
project_dir = ".jac/mobile-rn"
default_platform = "android"
